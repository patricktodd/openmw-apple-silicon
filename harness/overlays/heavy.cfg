# "Heavy" profile: settings-only stand-in for a heavily modded install.
# Pushes draw-call count (view distance, paging threshold, shadows, water passes,
# post-processing) and simulation load (actor processing range) without needing mods.
[Camera]
viewing distance = 24576.0

[Terrain]
distant terrain = true
object paging min size = 0.004

[Shadows]
enable shadows = true
number of shadow maps = 3
object shadows = true
terrain shadows = true
actor shadows = true

[Water]
shader = true
refraction = true

[Post Processing]
enabled = true

[Game]
actors processing range = 14336
